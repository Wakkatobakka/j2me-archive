<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="title desc">
<title id="title">A little phone with unfinished business</title><desc id="desc">An original illustration of a feature phone displaying J2ME, with a separate caption beneath it: small screens, long afterlives.</desc>
<defs>
 <radialGradient id="halo"><stop stop-color="#28343b" stop-opacity=".55"/><stop offset="1" stop-color="#111722" stop-opacity="0"/></radialGradient>
 <linearGradient id="case" x2=".9" y2="1"><stop stop-color="#586575"/><stop offset=".3" stop-color="#252e3d"/><stop offset="1" stop-color="#151d2b"/></linearGradient>
 <linearGradient id="screen" x2=".6" y2="1"><stop stop-color="#243b3c"/><stop offset="1" stop-color="#102429"/></linearGradient>
 <linearGradient id="key" x2="0" y2="1"><stop stop-color="#647286"/><stop offset="1" stop-color="#303b4d"/></linearGradient>
 <filter id="shadow" x="-.4" y="-.3" width="1.8" height="1.8"><feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/><feOffset in="blur" dx="0" dy="15" result="offset"/><feFlood flood-color="#000" flood-opacity=".4" result="color"/><feComposite in="color" in2="offset" operator="in" result="shade"/><feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="300" cy="292" r="278" fill="url(#halo)"/>
<circle cx="300" cy="292" r="228" fill="none" stroke="#27303d"/>
<circle cx="300" cy="292" r="190" fill="none" stroke="#27303d" stroke-dasharray="2 10"/>
<g opacity=".55" stroke="#576a72"><path d="M70 110h20m-10-10v20M475 415h20m-10-10v20"/><path d="M440 90h8M141 452h8"/></g>
<g transform="translate(175 39) rotate(8 125 236)" filter="url(#shadow)">
 <rect width="250" height="470" rx="43" fill="#111824" stroke="#6e7c90" stroke-width="3"/>
 <rect x="7" y="7" width="236" height="456" rx="38" fill="url(#case)" stroke="#3d4c60" stroke-width="2"/>
 <rect x="88" y="21" width="74" height="7" rx="4" fill="#101722"/>
 <rect x="21" y="44" width="208" height="247" rx="9" fill="#0c131a"/>
 <rect x="28" y="51" width="194" height="233" rx="3" fill="url(#screen)"/>
 <g font-family="DejaVu Sans Mono,monospace">
  <text x="42" y="75" fill="#a7daeb" font-size="9" letter-spacing="1">JAVA / POCKET HISTORY</text>
  <path d="M42 88h166" stroke="#557275" opacity=".6"/>
  <text x="125" y="156" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="43" fill="#ffb078">J2ME</text>
  <text x="125" y="187" text-anchor="middle" fill="#bed9d4" font-size="10" letter-spacing="2">PRESS START. AGAIN.</text>
  <rect x="55" y="211" width="140" height="33" rx="3" fill="#a7daeb" fill-opacity=".1" stroke="#6b9b9c"/>
  <text x="125" y="232" text-anchor="middle" fill="#bfe2e6" font-size="10">&gt; CONTINUE</text>
  <text x="42" y="270" fill="#698b8a" font-size="8">OPTIONS</text><text x="208" y="270" text-anchor="end" fill="#698b8a" font-size="8">BACK</text>
 </g>
 <rect x="28" y="307" width="54" height="15" rx="7" fill="url(#key)"/><rect x="168" y="307" width="54" height="15" rx="7" fill="url(#key)"/>
 <rect x="100" y="304" width="50" height="45" rx="13" fill="#121c2a" stroke="#7a8d9e" stroke-width="3"/>
 <rect x="112" y="315" width="26" height="23" rx="5" fill="#ffb078"/>
 <g fill="url(#key)">
  <rect x="32" y="365" width="54" height="20" rx="7"/><rect x="98" y="365" width="54" height="20" rx="7"/><rect x="164" y="365" width="54" height="20" rx="7"/>
  <rect x="32" y="395" width="54" height="20" rx="7"/><rect x="98" y="395" width="54" height="20" rx="7"/><rect x="164" y="395" width="54" height="20" rx="7"/>
  <rect x="32" y="425" width="54" height="20" rx="7"/><rect x="98" y="425" width="54" height="20" rx="7"/><rect x="164" y="425" width="54" height="20" rx="7"/>
 </g>
</g>
<g transform="translate(54 333) rotate(-7)">
 <rect width="114" height="109" rx="12" fill="#192331" stroke="#637080"/>
 <path d="M22 22h47l22 22v44H22Z" fill="none" stroke="#a7daeb" stroke-width="2"/><path d="M68 23v22h22" fill="none" stroke="#a7daeb" stroke-width="2"/>
 <text x="56" y="73" text-anchor="middle" font-family="DejaVu Sans Mono,monospace" font-size="19" fill="#ffb078">.jar</text>
</g>
<g transform="translate(207 551)">
 <path d="M0 0h342v65H0z" fill="#141d29" stroke="#3f4a58"/>
 <path d="M0 0v65" stroke="#ffb078" stroke-width="3"/>
 <text x="22" y="27" font-family="DejaVu Sans Mono,monospace" font-size="19" letter-spacing="2" fill="#ffb078">SMALL SCREENS.</text>
 <text x="22" y="49" font-family="DejaVu Sans Mono,monospace" font-size="16" letter-spacing="2" fill="#b9c5d1">LONG AFTERLIVES.</text>
</g>
</svg>
